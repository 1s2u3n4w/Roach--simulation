<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>바퀴벌레 시뮬레이션 (Roach Simulation)</title>
    <meta name="description" content="인터렉티브 2D 바퀴벌레 시뮬레이션! 과자를 놓고 살충제 내성 및 겔 제재 감염 생태계를 체험해보세요.">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Dynamic SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪳</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }

        #gameCanvas {
            touch-action: none;
        }

        /* Floor backgrounds */
        .floor-wood {
            background-color: #160e08;
            background-image: radial-gradient(#24170d 15%, transparent 16%),
                              radial-gradient(#0d0805 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        .floor-tile {
            background-color: #0b101d;
            background-image: linear-gradient(to right, #04070d 2px, transparent 2px),
                              linear-gradient(to bottom, #04070d 2px, transparent 2px);
            background-size: 50px 50px;
        }

        .floor-tatami {
            background-color: #141a12;
            background-image: repeating-linear-gradient(0deg, #1c2419, #1c2419 10px, #141a12 10px, #141a12 20px);
        }

        .glass-panel {
            background: rgba(8, 12, 22, 0.90);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        #light-overlay {
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }

        .light-on {
            opacity: 0;
        }

        .light-off {
            opacity: 0.75;
            background: #000;
        }

        /* Accordion transition styles */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0, 1, 0, 1), opacity 0.25s ease-in-out;
            opacity: 0;
        }

        .accordion-content.open {
            max-height: 250px;
            opacity: 1;
            transition: max-height 0.3s ease-in-out, opacity 0.25s ease-in-out;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="floor-wood relative w-screen h-screen overflow-hidden select-none" id="game-body">

    <div id="light-overlay" class="absolute inset-0 z-10 light-off"></div>

    <canvas id="gameCanvas" class="absolute inset-0 z-0 cursor-pointer w-full h-full"></canvas>

    <!-- Top HUD Navigation & Stats Bar -->

    <script>
        /* Web Audio API Sound Generator */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                try {
                    if (!this.ctx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            this.ctx = new AudioContext();
                        }
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume().catch(() => {});
                    }
                } catch (e) {}
            }

            playPop() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx || this.ctx.state !== 'running') return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch (e) {}
            }

            playCrunch() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx || this.ctx.state !== 'running') return;
                try {
                    const bufferSize = Math.floor(this.ctx.sampleRate * 0.04);
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1200 + Math.random() * 800;
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                } catch (e) {}
            }

            playSpray() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx || this.ctx.state !== 'running') return;
                try {
                    const bufferSize = Math.floor(this.ctx.sampleRate * 0.05);
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.value = 2500;
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                } catch (e) {}
            }

            playSquish() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx || this.ctx.state !== 'running') return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch (e) {}
            }

            playExplosion() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx || this.ctx.state !== 'running') return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch (e) {}
            }

            playClick() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx || this.ctx.state !== 'running') return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.03);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.03);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.03);
                } catch (e) {}
            }
        }

        const sounds = new SoundEngine();
        window.addEventListener('pointerdown', () => { sounds.init(); }, { once: true });
    </script>

    <script>
        /* Snack & Gel Bait Data Types */
        const SNACK_TYPES = {
            cookie: { emoji: '🍪', color: '#d97706', size: 24, crumbs: '#b45309' },
            pizza: { emoji: '🍕', color: '#e11d48', size: 28, crumbs: '#f59e0b' },
            donut: { emoji: '🍩', color: '#db2777', size: 26, crumbs: '#f472b6' },
            custom: { emoji: '🖼️', color: '#3b82f6', size: 28, crumbs: '#60a5fa' }
        };

        class Snack {
            constructor(x, y, type = 'cookie') {
                this.x = x;
                this.y = y;
                this.type = type;
                this.isGelBait = false;
                this.info = SNACK_TYPES[type] || SNACK_TYPES.cookie;
                if (type === 'custom' && window.customSnackImage) {
                    this.img = window.customSnackImage;
                }
                this.maxHp = 100;
                this.hp = 100;
                this.radius = this.info.size;
                this.initialRadius = this.info.size;
                this.scale = 0;
                this.targetScale = 1;
                this.bites = [];
            }

            update() {
                if (this.scale < this.targetScale) {
                    this.scale += (this.targetScale - this.scale) * 0.2;
                }
                this.radius = Math.max(0, this.initialRadius * (Math.max(0, this.hp) / this.maxHp));
            }

            addBiteMark(roachX, roachY) {
                const angle = Math.atan2(roachY - this.y, roachX - this.x);
                const dist = Math.min(this.radius * 0.8, Math.hypot(roachX - this.x, roachY - this.y));
                this.bites.push({
                    rx: Math.cos(angle) * dist,
                    ry: Math.sin(angle) * dist,
                    r: Math.max(1, 4 + Math.random() * 4)
                });
            }

            draw(ctx) {
                if (this.radius <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);

                const rx = Math.max(0.1, this.radius * 0.9);
                const ry = Math.max(0.1, this.radius * 0.4);
                ctx.beginPath();
                ctx.ellipse(2, this.radius * 0.6, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fill();

                if (this.type === 'custom' && this.img && this.img.complete) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, Math.max(0.1, this.radius), 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(this.img, -this.radius, -this.radius, this.radius * 2, this.radius * 2);
                    ctx.restore();
                } else {
                    ctx.font = `${Math.max(12, this.radius * 1.5)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.info.emoji, 0, 0);
                }

                ctx.fillStyle = '#0a0a0a';
                for (let bite of this.bites) {
                    ctx.beginPath();
                    ctx.arc(bite.rx, bite.ry, Math.max(0.1, bite.r), 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        /* Gel Bait Item */
        class GelBait {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.type = 'gel';
                this.isGelBait = true;
                this.maxHp = 100;
                this.hp = 100;
                this.radius = 18;
                this.initialRadius = 18;
                this.scale = 0;
                this.targetScale = 1;
                this.bites = [];
                this.info = { emoji: '🧪', color: '#10b981', crumbs: '#059669' };
            }

            update() {
                if (this.scale < this.targetScale) {
                    this.scale += (this.targetScale - this.scale) * 0.2;
                }
                this.radius = Math.max(0, this.initialRadius * (Math.max(0, this.hp) / this.maxHp));
            }

            addBiteMark(roachX, roachY) {
                const angle = Math.atan2(roachY - this.y, roachX - this.x);
                const dist = Math.min(this.radius * 0.8, Math.hypot(roachX - this.x, roachY - this.y));
                this.bites.push({
                    rx: Math.cos(angle) * dist,
                    ry: Math.sin(angle) * dist,
                    r: Math.max(1, 3 + Math.random() * 3)
                });
            }

            draw(ctx) {
                if (this.radius <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);

                // Glowing Gel Aura
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 1.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
                ctx.fill();

                ctx.font = `${Math.max(12, this.radius * 1.5)}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🧪', 0, 0);

                ctx.fillStyle = '#0a0a0a';
                for (let bite of this.bites) {
                    ctx.beginPath();
                    ctx.arc(bite.rx, bite.ry, Math.max(0.1, bite.r), 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        /* Gel Particle emitted by infected roaches / explosion */
        class GelParticle {
            constructor(x, y, vx, vy, isExplosion = false) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = isExplosion ? 5 + Math.random() * 4 : 3 + Math.random() * 2.5;
                this.alpha = 1.0;
                this.decay = isExplosion ? 0.006 + Math.random() * 0.004 : 0.012 + Math.random() * 0.008;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.94;
                this.vy *= 0.94;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.radius), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /* Pesticide Spray Particles */
        class SprayParticle {
            constructor(x, y, colorKey, hex) {
                this.x = x;
                this.y = y;
                this.colorKey = colorKey;
                this.hex = hex;
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.0 + Math.random() * 3.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.radius = 5 + Math.random() * 6;
                this.maxRadius = 18 + Math.random() * 15;
                this.alpha = 0.7;
                this.decay = 0.00115;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.92;
                this.vy *= 0.92;
                if (this.radius < this.maxRadius) this.radius += 0.15;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.hex;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.radius), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color = '#38bdf8') {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.alpha = 1;
                this.vy = -1.2;
            }

            update() {
                this.y += this.vy;
                this.alpha -= 0.02;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 12px sans-serif';
                ctx.fillStyle = this.color;
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, speed = 2) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.radius = 1.5 + Math.random() * 2.5;
                this.alpha = 1;
                this.decay = 0.02 + Math.random() * 0.03;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                if (this.radius <= 0 || this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.radius), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Splat {
            constructor(x, y, size, color = '#23330b') {
                this.x = x;
                this.y = y;
                this.size = Math.max(1, size);
                this.color = color;
                this.alpha = 0.85;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                const splatRx = Math.max(0.1, this.size * 1.2);
                const splatRy = Math.max(0.1, this.size * 0.7);
                ctx.ellipse(this.x, this.y, splatRx, splatRy, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x - this.size * 0.8, this.y - this.size * 0.5, Math.max(0.1, this.size * 0.3), 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 0.9, this.y + this.size * 0.4, Math.max(0.1, this.size * 0.25), 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 0.2, this.y - this.size * 0.9, Math.max(0.1, this.size * 0.2), 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }
    </script>

    <script>
        /* Cockroach AI with Gel Infection & Explosion */
        class Cockroach {
            constructor(x, y, baseSpeedMultiplier = 1, sizeMultiplier = 1) {
                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.targetAngle = this.angle;
                
                this.sizeScale = sizeMultiplier;
                this.bodyLength = 18 * this.sizeScale;
                this.bodyWidth = 9 * this.sizeScale;

                this.baseSpeed = (2.2 + Math.random() * 1.2) * baseSpeedMultiplier;
                this.speed = this.baseSpeed;
                this.turnSpeed = 0.12 + Math.random() * 0.08;

                this.legPhase = Math.random() * 10;
                this.antennaWiggle = 0;

                this.lastImmunityNoticeTime = 0;

                // Infection Properties
                this.isInfected = false;
                this.infectionStartTime = 0;
                this.shouldExplode = false;

                this.state = 'WANDER';
                this.targetSnack = null;
                this.eatTimer = 0;
                this.isHiding = false;

                this.wanderTarget = { x: this.x, y: this.y };
                this.pickNewWanderTarget();
            }

            infect() {
                if (this.isInfected) return;
                this.isInfected = true;
                this.infectionStartTime = Date.now();
                if (window.gameInstance) {
                    window.gameInstance.floatingTexts.push(new FloatingText(this.x, this.y - 15, '🧪 겔 감염!', '#10b981'));
                }
            }

            pickNewWanderTarget() {
                const margin = 50;
                this.wanderTarget = {
                    x: margin + Math.random() * (window.innerWidth - margin * 2),
                    y: margin + Math.random() * (window.innerHeight - margin * 2)
                };
            }

            update(foodItems, isLightOn, globalSpeedMult, globalSizeMult) {
                const effectiveSpeed = this.baseSpeed * globalSpeedMult;
                const effectiveScale = this.sizeScale * globalSizeMult;
                this.bodyLength = 18 * effectiveScale;
                this.bodyWidth = 9 * effectiveScale;

                // Infection Progression & Explosion Check
                if (this.isInfected) {
                    const elapsed = (Date.now() - this.infectionStartTime) / 1000;
                    if (elapsed >= 10) {
                        this.shouldExplode = true;
                    } else if (this.speed > 0 && Math.random() < 0.35) {
                        // Scatter gel particles while moving
                        if (window.gameInstance) {
                            const angle = this.angle + Math.PI + (Math.random() - 0.5);
                            const spd = 0.8 + Math.random() * 1.2;
                            window.gameInstance.gelParticles.push(new GelParticle(
                                this.x, this.y,
                                Math.cos(angle) * spd,
                                Math.sin(angle) * spd
                            ));
                        }
                    }
                }

                if (isLightOn) {
                    this.state = 'FLEE';
                    this.targetSnack = null;
                } else if (this.state === 'FLEE' && !isLightOn) {
                    this.state = 'WANDER';
                    this.isHiding = false;
                }

                if (this.state === 'FLEE') {
                    let targetX = this.x < window.innerWidth / 2 ? -100 : window.innerWidth + 100;
                    let targetY = this.y < window.innerHeight / 2 ? -100 : window.innerHeight + 100;
                    this.targetAngle = Math.atan2(targetY - this.y, targetX - this.x);
                    this.speed = effectiveSpeed * 1.8;

                    if (this.x < -40 || this.x > window.innerWidth + 40 || this.y < -40 || this.y > window.innerHeight + 40) {
                        this.isHiding = true;
                    }
                } 
                else if (foodItems.length > 0) {
                    let closest = null;
                    let minDist = Infinity;

                    for (let item of foodItems) {
                        const dist = Math.hypot(item.x - this.x, item.y - this.y);
                        if (dist < minDist) {
                            minDist = dist;
                            closest = item;
                        }
                    }

                    if (closest) {
                        this.targetSnack = closest;
                        const distToSnack = Math.hypot(closest.x - this.x, closest.y - this.y);

                        if (distToSnack < closest.radius + this.bodyLength * 0.5) {
                            this.state = 'EATING';
                            this.speed = 0;
                            this.eatTimer++;

                            if (this.eatTimer % 8 === 0) {
                                closest.hp -= 2.5;
                                closest.addBiteMark(this.x, this.y);
                                sounds.playCrunch();

                                // Reduced breeding timer by 0.1s for non-gel food!
                                if (!closest.isGelBait && window.gameInstance) {
                                    window.gameInstance.reduceBreedTimer(0.1);
                                }

                                // Infect roach if eating gel bait!
                                if (closest.isGelBait) {
                                    this.infect();
                                }

                                if (window.gameInstance) {
                                    window.gameInstance.spawnCrumbs(this.x, this.y, closest.info.crumbs);
                                }
                            }

                            if (closest.hp <= 0) {
                                this.state = 'WANDER';
                                this.targetSnack = null;
                            }
                        } else {
                            this.state = 'SEEK_FOOD';
                            this.targetAngle = Math.atan2(closest.y - this.y, closest.x - this.x);
                            this.speed = effectiveSpeed;
                        }
                    }
                } 
                else {
                    this.state = 'WANDER';
                    this.speed = effectiveSpeed * 0.7;

                    const distToWander = Math.hypot(this.wanderTarget.x - this.x, this.wanderTarget.y - this.y);
                    if (distToWander < 30 || Math.random() < 0.005) {
                        this.pickNewWanderTarget();
                    }
                    this.targetAngle = Math.atan2(this.wanderTarget.y - this.y, this.wanderTarget.x - this.x);
                }

                let diff = this.targetAngle - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                this.angle += diff * this.turnSpeed;

                if (this.speed > 0) {
                    const jitter = (Math.random() - 0.5) * 0.1;
                    this.x += Math.cos(this.angle + jitter) * this.speed;
                    this.y += Math.sin(this.angle + jitter) * this.speed;

                    this.legPhase += this.speed * 0.35;
                }

                this.antennaWiggle += 0.15;

                if (this.state !== 'FLEE') {
                    const margin = 10;
                    if (this.x < margin) this.x = margin;
                    if (this.x > window.innerWidth - margin) this.x = window.innerWidth - margin;
                    if (this.y < margin) this.y = margin;
                    if (this.y > window.innerHeight - margin) this.y = window.innerHeight - margin;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Draw Infected Green Aura Effect
                if (this.isInfected) {
                    const pulse = Math.sin(Date.now() * 0.01) * 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.bodyLength * 0.7 + pulse, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(16, 185, 129, 0.3)';
                    ctx.fill();
                    ctx.strokeStyle = '#22c55e';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                // Shadow
                ctx.beginPath();
                const shadowRx = Math.max(0.1, this.bodyLength * 0.55);
                const shadowRy = Math.max(0.1, this.bodyWidth * 0.6);
                ctx.ellipse(0, 3, shadowRx, shadowRy, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.fill();

                // Legs
                ctx.strokeStyle = '#2d1810';
                ctx.lineWidth = Math.max(1.0, 1.2 * (this.bodyLength / 18));
                ctx.lineCap = 'round';

                const legPairs = [
                    { attachX: this.bodyLength * 0.2, length: this.bodyWidth * 0.085, phaseOffset: 0 },
                    { attachX: 0, length: this.bodyWidth * 0.1, phaseOffset: Math.PI / 2 },
                    { attachX: -this.bodyLength * 0.25, length: this.bodyWidth * 0.115, phaseOffset: Math.PI }
                ];

                for (let leg of legPairs) {
                    let leftAngle = -Math.PI / 2 + Math.sin(this.legPhase + leg.phaseOffset) * 0.35;
                    ctx.beginPath();
                    ctx.moveTo(leg.attachX, -this.bodyWidth * 0.4);
                    let lx1 = leg.attachX + Math.cos(leftAngle) * (leg.length * 0.6);
                    let ly1 = -this.bodyWidth * 0.4 + Math.sin(leftAngle) * (leg.length * 0.6);
                    let lx2 = lx1 + Math.cos(leftAngle - 0.4) * (leg.length * 0.6);
                    let ly2 = ly1 + Math.sin(leftAngle - 0.4) * (leg.length * 0.6);
                    ctx.lineTo(lx1, ly1);
                    ctx.lineTo(lx2, ly2);
                    ctx.stroke();

                    let rightAngle = Math.PI / 2 + Math.sin(this.legPhase + leg.phaseOffset + Math.PI) * 0.35;
                    ctx.beginPath();
                    ctx.moveTo(leg.attachX, this.bodyWidth * 0.4);
                    let rx1 = leg.attachX + Math.cos(rightAngle) * (leg.length * 0.6);
                    let ry1 = this.bodyWidth * 0.4 + Math.sin(rightAngle) * (leg.length * 0.6);
                    let rx2 = rx1 + Math.cos(rightAngle + 0.4) * (leg.length * 0.6);
                    let ry2 = ry1 + Math.sin(rightAngle + 0.4) * (leg.length * 0.6);
                    ctx.lineTo(rx1, ry1);
                    ctx.lineTo(rx2, ry2);
                    ctx.stroke();
                }

                // Antennae
                ctx.strokeStyle = '#3e1f13';
                ctx.lineWidth = 1;

                ctx.beginPath();
                ctx.moveTo(this.bodyLength * 0.45, -this.bodyWidth * 0.2);
                ctx.quadraticCurveTo(
                    this.bodyLength * 0.76,
                    -this.bodyWidth * 0.85 + Math.sin(this.antennaWiggle) * 3,
                    this.bodyLength * 1.18,
                    -this.bodyWidth * 0.55 + Math.cos(this.antennaWiggle) * 4
                );
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(this.bodyLength * 0.45, this.bodyWidth * 0.2);
                ctx.quadraticCurveTo(
                    this.bodyLength * 0.76,
                    this.bodyWidth * 0.85 + Math.cos(this.antennaWiggle) * 3,
                    this.bodyLength * 1.18,
                    this.bodyWidth * 0.55 + Math.sin(this.antennaWiggle) * 4
                );
                ctx.stroke();

                // Body
                const grad = ctx.createLinearGradient(-this.bodyLength * 0.5, 0, this.bodyLength * 0.5, 0);
                if (this.isInfected) {
                    grad.addColorStop(0, '#064e3b');
                    grad.addColorStop(0.4, '#047857');
                    grad.addColorStop(0.8, '#10b981');
                    grad.addColorStop(1, '#065f46');
                } else {
                    grad.addColorStop(0, '#1c0d06');
                    grad.addColorStop(0.4, '#4a2511');
                    grad.addColorStop(0.8, '#7c3f1d');
                    grad.addColorStop(1, '#3b1c0c');
                }

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.bodyLength * 0.5, this.bodyWidth * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body Segment Lines
                ctx.strokeStyle = this.isInfected ? '#022c22' : '#231007';
                ctx.lineWidth = 1;
                for (let i = -0.3; i <= 0.2; i += 0.15) {
                    ctx.beginPath();
                    ctx.arc(this.bodyLength * i, 0, this.bodyWidth * 0.48, -Math.PI / 2, Math.PI / 2);
                    ctx.stroke();
                }

                // Gloss Highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.beginPath();
                ctx.ellipse(this.bodyLength * 0.1, -this.bodyWidth * 0.15, this.bodyLength * 0.25, this.bodyWidth * 0.12, -0.2, 0, Math.PI * 2);
                ctx.fill();

                // Head
                ctx.fillStyle = this.isInfected ? '#064e3b' : '#2d1408';
                ctx.beginPath();
                ctx.arc(this.bodyLength * 0.4, 0, this.bodyWidth * 0.35, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            isPointInside(px, py) {
                const dist = Math.hypot(px - this.x, py - this.y);
                return dist < Math.max(this.bodyLength, 20);
            }
        }
    </script>

    <script>
        class RoachBuffetGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.roaches = [];
                this.snacks = [];
                this.gelBaits = [];
                this.gelParticles = [];
                this.particles = [];
                this.sprayParticles = [];
                this.floatingTexts = [];
                this.splats = [];

                this.activeTool = 'snack'; // 'snack', 'gel', 'spray'
                this.selectedSnackType = 'cookie';
                
                this.selectedSprayColor = 'red';
                this.sprayColorHex = '#ef4444';

                this.deathsByColor = { red: 0, orange: 0, yellow: 0, green: 0, blue: 0, purple: 0, black: 0 };
                this.resistantColors = { red: false, orange: false, yellow: false, green: false, blue: false, purple: false, black: false };

                this.isLightOn = false;
                this.totalEatenCount = 0;

                this.speedMultiplier = 1;
                this.sizeMultiplier = 1;

                // Breeding Properties
                this.maxRoaches = 500;
                this.breedBaseInterval = 10.0;
                this.breedTimer = 10.0;
                this.lastFrameTime = performance.now();

                this.devicePixelRatio = window.devicePixelRatio || 1;
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                window.gameInstance = this;

                this.bindUI();
                this.bindInteractions();

                this.spawnRoaches(10);
                requestAnimationFrame((t) => this.loop(t));
            }

            resizeCanvas() {
                this.devicePixelRatio = window.devicePixelRatio || 1;
                const width = window.innerWidth;
                const height = window.innerHeight;

                this.canvas.width = width * this.devicePixelRatio;
                this.canvas.height = height * this.devicePixelRatio;
                this.canvas.style.width = width + 'px';
                this.canvas.style.height = height + 'px';

                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.ctx.scale(this.devicePixelRatio, this.devicePixelRatio);
            }

            spawnRoaches(count) {
                const currentCount = this.roaches.length;
                const toSpawn = Math.min(count, this.maxRoaches - currentCount);

                for (let i = 0; i < toSpawn; i++) {
                    let x, y;
                    if (Math.random() < 0.5) {
                        x = Math.random() < 0.5 ? -20 : window.innerWidth + 20;
                        y = Math.random() * window.innerHeight;
                    } else {
                        x = Math.random() * window.innerWidth;
                        y = Math.random() < 0.5 ? -20 : window.innerHeight + 20;
                    }
                    this.roaches.push(new Cockroach(x, y, this.speedMultiplier, this.sizeMultiplier));
                }
                this.updateStats();
            }

            breedMultiply() {
                if (this.roaches.length <= 0 || this.roaches.length >= this.maxRoaches) return;
                const currentCount = this.roaches.length;
                const spawnCount = Math.max(1, Math.floor(currentCount * 0.25));
                this.spawnRoaches(spawnCount);
            }

            reduceBreedTimer(amount) {
                this.breedTimer = Math.max(1.0, this.breedTimer - amount);
            }

            spawnCrumbs(x, y, color) {
                for (let i = 0; i < 3; i++) {
                    this.particles.push(new Particle(x, y, color, 3));
                }
                if (this.particles.length > 120) {
                    this.particles.shift();
                }
            }

            checkRoachSprayHit(roach, rIdx, x, y, customColor = null) {
                const colorHex = customColor || this.sprayColorHex;
                const cKey = customColor ? 'green' : this.selectedSprayColor;

                if (!customColor && cKey !== 'black' && this.resistantColors[cKey]) {
                    const now = Date.now();
                    if (now - roach.lastImmunityNoticeTime > 1200) {
                        roach.lastImmunityNoticeTime = now;
                        this.floatingTexts.push(new FloatingText(roach.x, roach.y - 12, '🛡️ 내성!', '#38bdf8'));
                    }
                } else {
                    this.splats.push(new Splat(roach.x, roach.y, roach.bodyLength, colorHex));
                    if (this.splats.length > 60) this.splats.shift();

                    this.roaches.splice(rIdx, 1);
                    sounds.playSquish();

                    for (let p = 0; p < 8; p++) {
                        this.particles.push(new Particle(roach.x, roach.y, colorHex, 4));
                    }

                    if (!customColor) {
                        this.deathsByColor[cKey]++;
                        if (cKey !== 'black' && this.deathsByColor[cKey] >= 10 && !this.resistantColors[cKey]) {
                            this.resistantColors[cKey] = true;
                            this.floatingTexts.push(new FloatingText(roach.x, roach.y - 20, '⚠️ 군집 내성 획득!', '#f59e0b'));
                        }
                        this.updateResistanceUI();
                    }
                    this.updateStats();
                }
            }

            explodeRoach(roach, index) {
                sounds.playSquish();
                sounds.playExplosion();

                this.splats.push(new Splat(roach.x, roach.y, roach.bodyLength * 1.8, '#15803d'));
                if (this.splats.length > 60) this.splats.shift();

                // Scatter 32 Gel Particles radially over a wide radius
                for (let k = 0; k < 32; k++) {
                    const angle = (Math.PI * 2 / 32) * k + (Math.random() - 0.5) * 0.2;
                    const speed = 2.5 + Math.random() * 6.5;
                    this.gelParticles.push(new GelParticle(
                        roach.x, roach.y,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        true
                    ));
                }

                for (let p = 0; p < 12; p++) {
                    this.particles.push(new Particle(roach.x, roach.y, '#22c55e', 6));
                }

                this.floatingTexts.push(new FloatingText(roach.x, roach.y - 20, '💥 겔 폭발!', '#10b981'));

                this.roaches.splice(index, 1);
                this.updateStats();
            }

            handleInteraction(clientX, clientY) {
                if (this.activeTool === 'snack') {
                    let squishedAny = false;

                    for (let i = this.roaches.length - 1; i >= 0; i--) {
                        if (!this.roaches[i].isHiding && this.roaches[i].isPointInside(clientX, clientY)) {
                            this.checkRoachSprayHit(this.roaches[i], i, clientX, clientY, '#23330b');
                            squishedAny = true;
                            break;
                        }
                    }

                    if (!squishedAny) {
                        const newSnack = new Snack(clientX, clientY, this.selectedSnackType);
                        this.snacks.push(newSnack);
                        sounds.playPop();

                        for (let i = 0; i < 8; i++) {
                            this.particles.push(new Particle(clientX, clientY, newSnack.info.crumbs, 4));
                        }
                    }
                } else if (this.activeTool === 'gel') {
                    const newGel = new GelBait(clientX, clientY);
                    this.gelBaits.push(newGel);
                    sounds.playPop();

                    for (let i = 0; i < 8; i++) {
                        this.particles.push(new Particle(clientX, clientY, '#10b981', 4));
                    }
                } else if (this.activeTool === 'spray') {
                    this.emitSpray(clientX, clientY);

                    for (let i = this.roaches.length - 1; i >= 0; i--) {
                        if (!this.roaches[i].isHiding && this.roaches[i].isPointInside(clientX, clientY)) {
                            this.checkRoachSprayHit(this.roaches[i], i, clientX, clientY);
                        }
                    }
                }

                this.updateStats();
            }

            bindInteractions() {
                let isPointerDown = false;
                let lastSnackPos = { x: 0, y: 0 };

                this.canvas.addEventListener('pointerdown', (e) => {
                    isPointerDown = true;
                    lastSnackPos = { x: e.clientX, y: e.clientY };
                    this.handleInteraction(e.clientX, e.clientY);
                });

                this.canvas.addEventListener('pointermove', (e) => {
                    if (isPointerDown) {
                        if (this.activeTool === 'spray') {
                            this.emitSpray(e.clientX, e.clientY);

                            for (let i = this.roaches.length - 1; i >= 0; i--) {
                                if (!this.roaches[i].isHiding && this.roaches[i].isPointInside(e.clientX, e.clientY)) {
                                    this.checkRoachSprayHit(this.roaches[i], i, e.clientX, e.clientY);
                                }
                            }
                        } else if (this.activeTool === 'snack' || this.activeTool === 'gel') {
                            const dist = Math.hypot(e.clientX - lastSnackPos.x, e.clientY - lastSnackPos.y);
                            if (dist > 45) {
                                lastSnackPos = { x: e.clientX, y: e.clientY };
                                this.handleInteraction(e.clientX, e.clientY);
                            }
                        }
                    }
                });

                window.addEventListener('pointerup', () => { isPointerDown = false; });
                window.addEventListener('pointercancel', () => { isPointerDown = false; });
            }

            emitSpray(x, y) {
                sounds.playSpray();
                for (let i = 0; i < 3; i++) {
                    this.sprayParticles.push(new SprayParticle(x, y, this.selectedSprayColor, this.sprayColorHex));
                }
                if (this.sprayParticles.length > 600) {
                    this.sprayParticles.splice(0, this.sprayParticles.length - 600);
                }
            }

            setTool(tool) {
                this.activeTool = tool;
                const btnSnack = document.getElementById('tool-btn-snack');
                const btnGel = document.getElementById('tool-btn-gel');
                const btnSpray = document.getElementById('tool-btn-spray');

                const activeClass = 'flex-1 py-1.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 bg-amber-500 text-slate-950 shadow';
                const inactiveClass = 'flex-1 py-1.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 text-slate-400 hover:text-white';

                btnSnack.className = tool === 'snack' ? activeClass : inactiveClass;
                btnGel.className = tool === 'gel' ? activeClass : inactiveClass;
                btnSpray.className = tool === 'spray' ? activeClass : inactiveClass;
            }

            bindUI() {
                // 참고 아코디언 토글 이벤트
                const btnRef = document.getElementById('btn-ref-accordion');
                const menuRef = document.getElementById('ref-accordion-menu');
                const iconChevron = document.getElementById('icon-ref-chevron');

                btnRef.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = menuRef.classList.contains('open');
                    if (isOpen) {
                        menuRef.classList.remove('open');
                        iconChevron.style.transform = 'rotate(0deg)';
                    } else {
                        menuRef.classList.add('open');
                        iconChevron.style.transform = 'rotate(180deg)';
                    }
                    sounds.playClick();
                });

                // 외부 클릭 시 참고 아코디언 닫기
                document.addEventListener('click', (e) => {
                    if (!btnRef.contains(e.target) && !menuRef.contains(e.target)) {
                        menuRef.classList.remove('open');
                        iconChevron.style.transform = 'rotate(0deg)';
                    }
                });

                document.getElementById('tool-btn-snack').addEventListener('click', () => {
                    this.setTool('snack');
                    sounds.playClick();
                });
                document.getElementById('tool-btn-gel').addEventListener('click', () => {
                    this.setTool('gel');
                    sounds.playClick();
                });
                document.getElementById('tool-btn-spray').addEventListener('click', () => {
                    this.setTool('spray');
                    sounds.playClick();
                });

                const sprayColorBtns = document.querySelectorAll('.spray-color-btn');
                sprayColorBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const target = e.currentTarget;
                        sprayColorBtns.forEach(b => {
                            b.classList.remove('active', 'border-2', 'border-amber-400', 'bg-amber-950/60');
                            b.classList.add('border-slate-800', 'bg-slate-950/80');
                        });
                        target.classList.add('active', 'border-2', 'border-amber-400');
                        target.classList.remove('border-slate-800');

                        this.selectedSprayColor = target.dataset.color;
                        this.sprayColorHex = target.dataset.hex;
                        this.setTool('spray');
                        sounds.playClick();
                    });
                });

                const snackBtns = document.querySelectorAll('.snack-btn');
                const fileInput = document.getElementById('input-snack-image');
                const customBtn = document.getElementById('btn-custom-snack');
                const customIcon = document.getElementById('custom-snack-icon');

                snackBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const target = e.currentTarget;
                        if (target.dataset.type === 'custom' && !window.customSnackImage) {
                            fileInput.click();
                            return;
                        }

                        snackBtns.forEach(b => {
                            b.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-500/30', 'text-amber-300', 'scale-105');
                            b.classList.add('text-slate-400');
                        });
                        target.classList.add('ring-2', 'ring-amber-400', 'bg-amber-500/30', 'text-amber-300', 'scale-105');
                        target.classList.remove('text-slate-400');

                        this.selectedSnackType = target.dataset.type;
                        this.setTool('snack');
                        sounds.playClick();
                    });
                });

                customBtn.addEventListener('dblclick', () => { fileInput.click(); });

                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const img = new Image();
                            img.onload = () => {
                                window.customSnackImage = img;
                                customIcon.innerHTML = `<img src="${event.target.result}" class="w-6 h-6 object-cover rounded-full border border-amber-400 shadow">`;
                                customBtn.click();
                            };
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });

                const btnLight = document.getElementById('btn-light');
                const lightOverlay = document.getElementById('light-overlay');
                const labelLight = document.getElementById('label-light');
                const iconLight = document.getElementById('icon-light');

                btnLight.addEventListener('click', () => {
                    this.isLightOn = !this.isLightOn;
                    sounds.playClick();

                    if (this.isLightOn) {
                        lightOverlay.classList.remove('light-off');
                        lightOverlay.classList.add('light-on');
                        labelLight.textContent = '불끄기';
                        iconLight.className = 'fa-solid fa-lightbulb text-amber-300 animate-pulse';
                    } else {
                        lightOverlay.classList.remove('light-on');
                        lightOverlay.classList.add('light-off');
                        labelLight.textContent = '불켜기';
                        iconLight.className = 'fa-solid fa-lightbulb text-amber-400';
                    }
                });

                const btnSound = document.getElementById('btn-sound');
                const iconSound = document.getElementById('icon-sound');
                btnSound.addEventListener('click', () => {
                    sounds.enabled = !sounds.enabled;
                    if (sounds.enabled) {
                        iconSound.className = 'fa-solid fa-volume-high text-slate-200';
                        sounds.playClick();
                    } else {
                        iconSound.className = 'fa-solid fa-volume-xmark text-rose-400';
                    }
                });

                const drawerWrapper = document.getElementById('bottom-bar-wrapper');
                const btnToggleDrawer = document.getElementById('btn-toggle-drawer');
                const iconToggleDrawer = document.getElementById('icon-toggle-drawer');
                const labelToggleDrawer = document.getElementById('label-toggle-drawer');
                let isDrawerCollapsed = false;

                btnToggleDrawer.addEventListener('click', (e) => {
                    e.stopPropagation();
                    isDrawerCollapsed = !isDrawerCollapsed;
                    sounds.playClick();

                    if (isDrawerCollapsed) {
                        drawerWrapper.classList.add('translate-y-[82%]');
                        iconToggleDrawer.className = 'fa-solid fa-chevron-up text-xs';
                        labelToggleDrawer.textContent = '도구창 열기';
                    } else {
                        drawerWrapper.classList.remove('translate-y-[82%]');
                        iconToggleDrawer.className = 'fa-solid fa-chevron-down text-xs';
                        labelToggleDrawer.textContent = '도구창 접기';
                    }
                });

                document.getElementById('btn-add-roach').addEventListener('click', () => {
                    this.spawnRoaches(1);
                    sounds.playClick();
                });

                document.getElementById('btn-clear').addEventListener('click', () => {
                    this.snacks = [];
                    this.gelBaits = [];
                    this.gelParticles = [];
                    this.splats = [];
                    this.particles = [];
                    this.sprayParticles = [];
                    sounds.playClick();
                    this.updateStats();
                });

                const modal = document.getElementById('settings-modal');
                document.getElementById('btn-toggle-settings').addEventListener('click', () => {
                    modal.classList.remove('hidden');
                    sounds.playClick();
                });

                document.getElementById('btn-close-settings').addEventListener('click', () => {
                    modal.classList.add('hidden');
                    sounds.playClick();
                });

                const sliderSpeed = document.getElementById('slider-speed');
                const valSpeed = document.getElementById('val-speed');
                const speedLabels = { '1': '매우 천천히', '2': '천천히', '3': '보통', '4': '빠름', '5': '빛의 속도' };
                sliderSpeed.addEventListener('input', (e) => {
                    const val = e.target.value;
                    valSpeed.textContent = speedLabels[val];
                    this.speedMultiplier = 0.4 + (val - 1) * 0.35;
                });

                const sliderSize = document.getElementById('slider-size');
                const valSize = document.getElementById('val-size');
                const sizeLabels = { '1': '소형', '2': '보통', '3': '대형', '4': '왕바퀴 (거대)' };
                sliderSize.addEventListener('input', (e) => {
                    const val = e.target.value;
                    valSize.textContent = sizeLabels[val];
                    this.sizeMultiplier = 0.6 + (val - 1) * 0.4;
                });

                const floorOpts = document.querySelectorAll('.floor-opt');
                const gameBody = document.getElementById('game-body');
                floorOpts.forEach(opt => {
                    opt.addEventListener('click', (e) => {
                        floorOpts.forEach(o => {
                            o.classList.remove('border-2', 'border-amber-400');
                            o.classList.add('border-slate-800');
                        });
                        e.target.classList.add('border-2', 'border-amber-400');
                        e.target.classList.remove('border-slate-800');

                        gameBody.className = `floor-${e.target.dataset.floor} relative w-screen h-screen overflow-hidden select-none`;
                        sounds.playClick();
                    });
                });

                document.getElementById('btn-reset-all').addEventListener('click', () => {
                    this.roaches = [];
                    this.snacks = [];
                    this.gelBaits = [];
                    this.gelParticles = [];
                    this.splats = [];
                    this.particles = [];
                    this.sprayParticles = [];
                    this.floatingTexts = [];
                    this.totalEatenCount = 0;
                    this.breedTimer = this.breedBaseInterval;
                    
                    Object.keys(this.deathsByColor).forEach(k => {
                        this.deathsByColor[k] = 0;
                        this.resistantColors[k] = false;
                    });
                    this.updateResistanceUI();

                    this.spawnRoaches(10);
                    modal.classList.add('hidden');
                    sounds.playClick();
                });
            }

            updateResistanceUI() {
                const colorBtns = document.querySelectorAll('.spray-color-btn');
                colorBtns.forEach(btn => {
                    const c = btn.dataset.color;
                    const statEl = btn.querySelector('.stat-res');
                    if (statEl) {
                        if (c === 'black') {
                            statEl.textContent = '☠️위험';
                            statEl.className = 'stat-res text-[8px] text-rose-400 font-bold';
                        } else if (this.resistantColors[c]) {
                            statEl.textContent = '🛡️내성';
                            statEl.className = 'stat-res text-[8px] text-sky-400 font-bold animate-pulse';
                        } else {
                            const count = this.deathsByColor[c] || 0;
                            statEl.textContent = `${count}/10`;
                            statEl.className = 'stat-res text-[8px] opacity-80';
                        }
                    }
                });
            }

            updateStats() {
                const sSnacks = document.getElementById('stat-snacks');
                const sRoaches = document.getElementById('stat-roaches');
                const sTimer = document.getElementById('stat-timer');
                const sEaten = document.getElementById('stat-eaten');
                if (sSnacks) sSnacks.textContent = this.snacks.length + this.gelBaits.length;
                if (sRoaches) sRoaches.textContent = `${this.roaches.length}/${this.maxRoaches}`;
                if (sTimer) sTimer.textContent = `${this.breedTimer.toFixed(1)}s`;
                if (sEaten) sEaten.textContent = this.totalEatenCount;
            }

            loop(timestamp) {
                const delta = Math.min((timestamp - this.lastFrameTime) / 1000, 0.1);
                this.lastFrameTime = timestamp;

                // Update Breeding Timer
                if (this.roaches.length > 0 && this.roaches.length < this.maxRoaches) {
                    this.breedTimer -= delta;
                    if (this.breedTimer <= 0) {
                        this.breedMultiply();
                        this.breedTimer = this.breedBaseInterval;
                    }
                } else {
                    this.breedTimer = this.breedBaseInterval;
                }
                this.updateStats();

                this.ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

                // 1. Draw Splats
                for (let splat of this.splats) {
                    splat.draw(this.ctx);
                }

                // 2. Update & Draw Snacks & Gel Baits
                for (let i = this.snacks.length - 1; i >= 0; i--) {
                    const snack = this.snacks[i];
                    snack.update();

                    if (snack.hp <= 0 || snack.radius <= 0) {
                        this.snacks.splice(i, 1);
                        this.totalEatenCount++;
                        this.updateStats();
                        continue;
                    }

                    snack.draw(this.ctx);
                }

                for (let i = this.gelBaits.length - 1; i >= 0; i--) {
                    const gel = this.gelBaits[i];
                    gel.update();

                    if (gel.hp <= 0 || gel.radius <= 0) {
                        this.gelBaits.splice(i, 1);
                        this.totalEatenCount++;
                        this.updateStats();
                        continue;
                    }

                    gel.draw(this.ctx);
                }

                // 3. Update & Draw Gel Particles (Check 2nd Infection on Roaches)
                for (let i = this.gelParticles.length - 1; i >= 0; i--) {
                    const gp = this.gelParticles[i];
                    gp.update();
                    gp.draw(this.ctx);

                    if (gp.alpha <= 0) {
                        this.gelParticles.splice(i, 1);
                        continue;
                    }

                    for (let r = 0; r < this.roaches.length; r++) {
                        const roach = this.roaches[r];
                        if (!roach.isHiding && !roach.isInfected) {
                            const dist = Math.hypot(gp.x - roach.x, gp.y - roach.y);
                            if (dist < gp.radius + roach.bodyLength * 0.5) {
                                roach.infect(); // Secondary Infection!
                                this.gelParticles.splice(i, 1);
                                break;
                            }
                        }
                    }
                }

                // 4. Update & Draw Pesticide Spray Particles
                for (let i = this.sprayParticles.length - 1; i >= 0; i--) {
                    const sp = this.sprayParticles[i];
                    sp.update();
                    sp.draw(this.ctx);

                    if (sp.alpha <= 0) {
                        this.sprayParticles.splice(i, 1);
                        continue;
                    }

                    for (let rIdx = this.roaches.length - 1; rIdx >= 0; rIdx--) {
                        const roach = this.roaches[rIdx];
                        if (roach.isHiding) continue;

                        const dist = Math.hypot(sp.x - roach.x, sp.y - roach.y);
                        if (dist < sp.radius + roach.bodyLength * 0.5) {
                            const cKey = sp.colorKey;

                            if (cKey !== 'black' && this.resistantColors[cKey]) {
                                const now = Date.now();
                                if (now - roach.lastImmunityNoticeTime > 1200) {
                                    roach.lastImmunityNoticeTime = now;
                                    this.floatingTexts.push(new FloatingText(roach.x, roach.y - 12, '🛡️ 내성!', '#38bdf8'));
                                }
                            } else {
                                this.splats.push(new Splat(roach.x, roach.y, roach.bodyLength, sp.hex));
                                if (this.splats.length > 60) this.splats.shift();

                                this.roaches.splice(rIdx, 1);
                                sounds.playSquish();

                                for (let p = 0; p < 8; p++) {
                                    this.particles.push(new Particle(roach.x, roach.y, sp.hex, 4));
                                }

                                this.deathsByColor[cKey]++;

                                if (cKey !== 'black' && this.deathsByColor[cKey] >= 10 && !this.resistantColors[cKey]) {
                                    this.resistantColors[cKey] = true;
                                    this.floatingTexts.push(new FloatingText(roach.x, roach.y - 20, '⚠️ 군집 내성 획득!', '#f59e0b'));
                                }

                                this.updateResistanceUI();
                                this.updateStats();
                            }
                            
                            this.sprayParticles.splice(i, 1);
                            break;
                        }
                    }
                }

                // 5. Update & Draw Cockroaches
                const foodList = [...this.snacks, ...this.gelBaits];
                for (let i = this.roaches.length - 1; i >= 0; i--) {
                    const roach = this.roaches[i];
                    roach.update(foodList, this.isLightOn, this.speedMultiplier, this.sizeMultiplier);
                    roach.draw(this.ctx);

                    if (roach.shouldExplode) {
                        this.explodeRoach(roach, i);
                    }
                }

                // 6. Update & Draw Particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const particle = this.particles[i];
                    particle.update();
                    particle.draw(this.ctx);

                    if (particle.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }

                // 7. Update & Draw Floating Notice Texts
                for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                    const ft = this.floatingTexts[i];
                    ft.update();
                    ft.draw(this.ctx);

                    if (ft.alpha <= 0) {
                        this.floatingTexts.splice(i, 1);
                    }
                }

                requestAnimationFrame((t) => this.loop(t));
            }
        }

        window.onload = () => {
            new RoachBuffetGame();
        };
    </script>
</body>
</html>
